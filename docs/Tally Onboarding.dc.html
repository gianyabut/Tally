<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#050505;font-family:'IBM Plex Mono',monospace}
a{color:#F0EEE9;text-decoration:none}a:hover{color:#fff}
</style>
</helmet>
<div style="padding:44px;display:flex;flex-direction:column;gap:44px">
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
    <span style="font-size:12px;letter-spacing:.24em;color:#F0EEE9;font-weight:500">TALLY · ONBOARDING PROTOTYPE</span>
    <span style="font-size:11px;color:#6C6A64">google auth → join team or go solo → credits → invites → ledger · every step clickable</span>
  </div>
  <div style="display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:10px" data-screen-label="Onboarding desktop dark">
      <span style="font-size:11px;letter-spacing:.18em;color:#6C6A64">DESKTOP · DARK</span>
      <div style="width:1280px;border:1px solid #262623;border-radius:6px;overflow:hidden">
        <dc-import name="Tally App" theme="dark" start-at-login="{{ true }}" hint-size="1280px,880px"></dc-import>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px" data-screen-label="Onboarding mobile dark">
      <span style="font-size:11px;letter-spacing:.18em;color:#6C6A64">MOBILE · DARK</span>
      <div style="width:390px;border:1px solid #262623;border-radius:6px;overflow:hidden">
        <dc-import name="Tally App" theme="dark" mobile="{{ true }}" start-at-login="{{ true }}" style="width:390px" hint-size="390px,840px"></dc-import>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:10px" data-screen-label="Onboarding desktop light">
      <span style="font-size:11px;letter-spacing:.18em;color:#6C6A64">DESKTOP · LIGHT</span>
      <div style="width:1280px;border:1px solid #262623;border-radius:6px;overflow:hidden">
        <dc-import name="Tally App" theme="light" start-at-login="{{ true }}" hint-size="1280px,880px"></dc-import>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px" data-screen-label="Onboarding mobile light">
      <span style="font-size:11px;letter-spacing:.18em;color:#6C6A64">MOBILE · LIGHT</span>
      <div style="width:390px;border:1px solid #262623;border-radius:6px;overflow:hidden">
        <dc-import name="Tally App" theme="light" mobile="{{ true }}" start-at-login="{{ true }}" style="width:390px" hint-size="390px,840px"></dc-import>
      </div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
